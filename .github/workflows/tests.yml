name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Setup mock-sbx
        run: |
          chmod +x tools/mock-sbx
          ls -la tools/sbx

      - name: Test mock-sbx script
        run: bash tools/mock-sbx-tests.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project sbx-ui.xcodeproj \
            -scheme "sbx-ui Canary"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project sbx-ui.xcodeproj \
            -scheme "sbx-ui Canary" \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          xcodebuild test-without-building \
            -project sbx-ui.xcodeproj \
            -scheme "sbx-ui Canary" \
            -destination 'platform=macOS' \
            -only-testing:sbx-uiTests

      # XCUITest (sbx-uiUITests) is intentionally not run on GitHub-hosted
      # macOS runners: macos-26 runner minutes bill at a steep multiple of
      # Linux minutes, and this suite (48 UI tests as of 2026-07) would run
      # on every push/PR. Run it locally instead before merging UI-affecting
      # changes:
      #   xcodebuild test-without-building -project sbx-ui.xcodeproj \
      #     -scheme "sbx-ui Canary" -destination 'platform=macOS' \
      #     -only-testing:sbx-uiUITests
      # (or Xcode: Product -> Test, sbx-uiUITests target). See
      # docs/sbx-modernization-plan.md Workstream B1 for the rationale.
